<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fffcf6" />
    <script>
      // Apply the saved palette before the app and styles finish loading.
      (() => {
        let saved;
        try { saved = localStorage.getItem('myco-theme'); } catch {}
        const theme = saved === 'light' || saved === 'dark' ? saved
          : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#28221c' : '#fffcf6';
      })();
    </script>
    <meta name="description" content="Plan your garden and rectangular beds from above, in centimetres." />
    <title>Myco · Garden planner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
